name: Android Release AAB

# Builds a PRODUCTION, signed Android App Bundle (.aab) for Google Play.
# Run manually (Actions -> Android Release AAB -> Run workflow) once these repo
# secrets are set (Settings -> Secrets and variables -> Actions):
#   ANDROID_KEYSTORE_BASE64   - base64 of your upload keystore (.jks)
#   ANDROID_KEYSTORE_PASSWORD - keystore password
#   ANDROID_KEY_ALIAS         - key alias
#   ANDROID_KEY_PASSWORD      - key password
#   GOOGLE_SERVICES_JSON      - (optional) the REAL Firebase google-services.json
#                               so push works in the released app; a placeholder
#                               is used if it's absent.
# The output artifact `alhamra-workpermit-release-aab` is what you upload to Play.

on:
  workflow_dispatch:
    inputs:
      versionName:
        description: 'Version name (e.g. 1.0.0)'
        required: true
        default: '1.0.0'
      versionCode:
        description: 'Version code (integer, must increase each upload)'
        required: true
        default: '1'

jobs:
  release-aab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web assets
        run: bun run build

      - name: Add Android platform
        run: node node_modules/@capacitor/cli/bin/capacitor add android

      - name: Generate app icon & splash (Al Hamra logo)
        run: npx --yes @capacitor/assets@3 generate --android --iconBackgroundColor '#FFFFFF' --iconBackgroundColorDark '#FFFFFF' --splashBackgroundColor '#FFFFFF' --splashBackgroundColorDark '#FFFFFF'

      - name: google-services.json (real if provided, else placeholder)
        env:
          GS: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GS" ]; then
            printf '%s' "$GS" > android/app/google-services.json
            echo "Using real google-services.json from secret."
          else
            cat > android/app/google-services.json <<'JSON'
          {
            "project_info": { "project_number": "000000000000", "project_id": "alhamra-workpermit-placeholder", "storage_bucket": "alhamra-workpermit-placeholder.appspot.com" },
            "client": [ { "client_info": { "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000", "android_client_info": { "package_name": "com.alhamra.workpermit" } }, "oauth_client": [], "api_key": [ { "current_key": "AIzaSyPLACEHOLDER0000000000000000000000000" } ], "services": { "appinvite_service": { "other_platform_oauth_client": [] } } } ],
            "configuration_version": "1"
          }
          JSON
            echo "WARNING: using placeholder google-services.json (push disabled)."
          fi

      - name: Set version name/code
        run: |
          python3 - <<PY
          import re
          p = 'android/app/build.gradle'
          s = open(p, encoding='utf-8').read()
          s = re.sub(r'versionCode\s+\d+', 'versionCode ${{ github.event.inputs.versionCode }}', s, count=1)
          s = re.sub(r'versionName\s+"[^"]*"', 'versionName "${{ github.event.inputs.versionName }}"', s, count=1)
          open(p,'w',encoding='utf-8').write(s)
          print('version set')
          PY

      - name: Sync Android project
        run: node node_modules/@capacitor/cli/bin/capacitor sync android

      - name: Decode upload keystore
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set"; exit 1; fi
          echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build release AAB
        run: cd android && ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Sign AAB
        env:
          KS_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore "$RUNNER_TEMP/release.jks" -storepass "$KS_PW" -keypass "$KEY_PW" \
            android/app/build/outputs/bundle/release/app-release.aab "$KEY_ALIAS"

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: alhamra-workpermit-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
